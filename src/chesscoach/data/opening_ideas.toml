# The main idea of each opening, in a sentence or two, for a club player.
# Keyed by the opening's name as in the Lichess tables; the longest key that
# starts the game's opening name wins ("Sicilian Defense: Dragon Variation"
# before "Sicilian Defense"). General ideas only: nothing here may claim a
# fact about a particular position.

"King's Pawn Game" = "White takes the centre with the e-pawn and opens lines for the queen and the king's bishop."
"Queen's Pawn Game" = "White takes the centre with the d-pawn, which the queen already defends; the play is usually slower and more positional than after 1.e4."
"Queen's Pawn Game: London System" = "White sets up d4, Bf4, e3 and c3 almost whatever Black does: a solid, easy-to-learn system aiming for a kingside attack or a slow squeeze."

"Sicilian Defense" = "Black answers 1.e4 with the c-pawn, fighting for d4 from the side. The position is unbalanced: White usually attacks on the kingside, Black counterattacks on the queenside and down the half-open c-file."
"Sicilian Defense: Open" = "White opens the centre with d4 and recaptures with the knight, gaining space and quick development; Black gets the half-open c-file and a central pawn majority."
"Sicilian Defense: Najdorf Variation" = "With ...a6 Black keeps White's pieces off b5 and prepares ...e5 or ...b5. One of the sharpest and most studied openings in chess."
"Sicilian Defense: Dragon Variation" = "Black fianchettoes the king's bishop on g7, where it bears down the long diagonal. The d6 pawn stops e5. White often castles long and attacks with h4-h5 against Black's king."
"Sicilian Defense: Accelerated Dragon" = "Black plays ...g6 before ...d6, keeping the option of ...d5 in one move; White can answer with c4, the Maróczy Bind, to clamp down on d5."
"Sicilian Defense: Scheveningen Variation" = "Black builds a small centre with pawns on e6 and d6, solid but cramped, waiting to strike back with ...d5 or ...b5."
"Sicilian Defense: Lasker-Pelikan Variation" = "Black plays an early ...e5, accepting a weak d5 square and a backward d-pawn in return for active pieces and time."
"Sicilian Defense: Taimanov Variation" = "Black keeps the pawn structure flexible with ...e6 and ...Nc6, developing quickly and choosing a plan later."
"Sicilian Defense: Alapin Variation" = "With 2.c3 White prepares d4 so that a pawn can recapture there, building a full pawn centre and avoiding the main lines."
"Sicilian Defense: Closed" = "White keeps the centre closed with Nc3 and d3, often fianchettoes, and later attacks on the kingside with f4."

"Ruy Lopez" = "White's bishop pressures the knight that defends e5. The pressure is indirect at first; White plans d4 and a slow build-up, Black usually challenges the bishop with ...a6."
"Ruy Lopez: Berlin Defense" = "Black counterattacks e4 with ...Nf6; the main lines lead to the solid Berlin endgame, famous for its drawing power."
"Ruy Lopez: Marshall Attack" = "Black gives up a pawn with ...d5 for a fast kingside attack and lasting initiative."
"Ruy Lopez: Exchange Variation" = "White gives up the bishop for the knight, doubling Black's c-pawns; White aims for an endgame where the healthy kingside majority counts."

"Italian Game" = "White's bishop on c4 aims at f7, the weakest point near Black's king. Play can be quiet (c3 and d3) or sharp (an early d4)."
"Italian Game: Giuoco Piano" = "Both bishops go to c4 and c5. White often prepares d4 with c3 to build a pawn centre."
"Italian Game: Evans Gambit" = "White gives up the b-pawn to gain time for c3 and d4 and a fast attack."
"Italian Game: Two Knights Defense" = "Black develops the knight to f6 at once and counterattacks e4, accepting sharp play if White goes for f7 with Ng5."

"Scotch Game" = "White opens the centre at once with d4. After the exchange on d4 White has free development and a pawn on e4, while Black has no pawn in the centre and must play actively."
"Petrov's Defense" = "Black mirrors White with ...Nf6, counterattacking e4 instead of defending e5. Solid and symmetrical."
"Four Knights Game" = "Both sides develop both knights first. Classical and safe; the game is decided by who uses the extra tempo better."
"Philidor Defense" = "Black defends e5 with the d-pawn: solid but passive, giving White more space."
"Vienna Game" = "White develops the queen's knight first, keeping f4 in reserve as a later attacking pawn break."
"King's Gambit" = "White gives up the f-pawn to open the f-file and pull Black's e-pawn away from the centre. Sharp, attacking, and full of traps for both sides."
"Bishop's Opening" = "White puts the bishop on c4 at once, aiming at f7 and keeping the choice between f4 and quiet play."
"Center Game" = "White opens the centre at once and recaptures with the queen, which can be harassed by ...Nc6."
"Ponziani Opening" = "White prepares d4 with c3, aiming for a pawn centre; Black can counter with ...d5 or ...Nf6."
"Scandinavian Defense" = "Black challenges e4 at once with ...d5. The queen often comes out early on a5 or d6; Black gets a solid, simple position."
"Alekhine Defense" = "Black invites White's pawns forward with ...Nf6 and then attacks the big centre as overextended."
"Pirc Defense" = "Black lets White build a centre, fianchettoes the bishop and strikes back later with ...e5 or ...c5."
"Modern Defense" = "Black fianchettoes the king's bishop first and keeps everything flexible, inviting White to take the centre."
"French Defense" = "Black prepares ...d5 with ...e6. The structure is solid but the light-squared bishop on c8 is often shut in; Black counterattacks White's centre with ...c5 and ...f6."
"French Defense: Advance Variation" = "White locks the centre with e5, gaining space; Black attacks the chain at its base with ...c5 and ...Qb6."
"French Defense: Winawer Variation" = "Black pins the knight with ...Bb4 and often gives up the bishop to double White's pawns: sharp and unbalanced."
"French Defense: Tarrasch Variation" = "White develops the knight to d2 so that it does not block the c-pawn and cannot be pinned."
"French Defense: Exchange Variation" = "The centre opens symmetrically; quiet, with few imbalances."
"Caro-Kann Defense" = "Black supports ...d5 with ...c6, keeping the light-squared bishop free to develop outside the pawn chain. Solid, with a sound pawn structure."
"Caro-Kann Defense: Advance Variation" = "White gains space with e5; Black develops the bishop to f5 and attacks the centre with ...c5."
"Caro-Kann Defense: Classical Variation" = "Black develops the bishop to f5 early; White chases it with knight and h-pawn moves to gain space."

"Queen's Gambit Declined" = "Black holds the centre with ...e6 and ...d5. Very solid; the main problem is developing the light-squared bishop."
"Queen's Gambit Accepted" = "Black takes the c-pawn, usually not to keep it but to free the position; White builds a centre and regains the pawn."
"Slav Defense" = "Black supports d5 with ...c6, keeping the c8 bishop free to develop, unlike in the Queen's Gambit Declined."
"Semi-Slav Defense" = "Black combines ...c6 and ...e6: a solid pawn wedge that can turn very sharp if Black later takes on c4."
"Tarrasch Defense" = "Black accepts an isolated d-pawn in return for free, active piece play."
"Catalan Opening" = "White combines the Queen's Gambit with a fianchettoed king's bishop, aiming down the long diagonal at Black's queenside."
"King's Indian Defense" = "Black lets White take the centre, fianchettoes the bishop and counterattacks with ...e5 or ...c5. Often White attacks on the queenside and Black on the kingside."
"Nimzo-Indian Defense" = "Black pins the c3 knight with ...Bb4 to stop e4, often giving up the bishop to damage White's pawns."
"Queen's Indian Defense" = "Black fianchettoes the queen's bishop to control e4 from a distance: flexible and solid."
"Grünfeld Defense" = "Black lets White build a big centre and then attacks it with pieces and the ...c5 break, the g7 bishop leading the way."
"Benoni Defense" = "Black accepts less space for a queenside pawn majority and active pieces; sharp and unbalanced."
"Benko Gambit" = "Black gives up a queenside pawn to open the a- and b-files for rooks and queen: long-term pressure rather than a quick attack."
"Dutch Defense" = "Black answers 1.d4 with ...f5, fighting for e4 and preparing a kingside attack, at the cost of a slightly loosened king."
"Bogo-Indian Defense" = "Black gives a check with ...Bb4 to simplify development; a calm alternative to the Nimzo-Indian."
"Trompowsky Attack" = "White pins or threatens to double Black's pawns with an early Bg5, avoiding much opening theory."
"Torre Attack" = "White develops quietly with Nf3 and Bg5, planning e4 later."

"English Opening" = "White fights for d5 from the side with the c-pawn, often fianchettoing the king's bishop. Flexible; it can transpose to many other openings."
"Réti Opening" = "White develops with Nf3 and often a fianchetto, controlling the centre with pieces before committing pawns."
"Zukertort Opening" = "White develops the knight to f3 first, keeping options open."
"King's Indian Attack" = "White sets up Nf3, g3, Bg2, d3 and e4 almost regardless of Black, then usually attacks on the kingside."
"Bird Opening" = "White plays f4, controlling e5 from the start and aiming for kingside play."
"Nimzo-Larsen Attack" = "White fianchettoes the queen's bishop with b3, controlling the long diagonal and e5."
"Polish Opening" = "White plays b4, gaining queenside space at the cost of a pawn that can be attacked."
