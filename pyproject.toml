[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "chesscoach"
dynamic = ["version"]
description = "Offline chess coach: Stockfish analyses, Maia predicts human moves, a local LLM narrates verified facts."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Amr" }]
keywords = ["chess", "stockfish", "maia", "llm", "ollama", "coaching", "annotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.10",
    "ollama>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = ["pywebview>=5"]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.40"]

[project.scripts]
chesscoach = "chesscoach.cli:main"

[project.gui-scripts]
chesscoach-app = "chesscoach.gui.app:main"

[project.urls]
Homepage = "https://github.com/OWNER/chesscoach"
Issues = "https://github.com/OWNER/chesscoach/issues"

[tool.hatch.version]
path = "src/chesscoach/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chesscoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: needs a Stockfish executable (skipped when none is found)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E9", "F"]
